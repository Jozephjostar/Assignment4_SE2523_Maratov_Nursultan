<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker for associations -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <!-- Dashed dependency arrow -->
    <marker id="dashed-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Client Box -->
  <g transform="translate(30, 200)" filter="url(#shadow)">
    <rect width="180" height="90" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <rect width="180" height="28" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="90" y="19" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">&lt;&lt;Client&gt;&gt; Main</text>
    <line x1="0" y1="28" x2="180" y2="28" stroke="#64748b" stroke-width="1.5"/>
    <text x="10" y="48" font-size="10" fill="#334155">+ main(args: String[]): void</text>
    <text x="10" y="66" font-size="9" fill="#64748b" font-style="italic">(interacts strictly with Facade)</text>
  </g>

  <!-- Arrow Client -> Facade -->
  <path d="M 210 245 L 285 245" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="245" y="235" font-size="10" fill="#475569" text-anchor="middle" font-weight="600">calls</text>

  <!-- Facade Box -->
  <g transform="translate(290, 110)" filter="url(#shadow)">
    <rect width="270" height="270" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect width="270" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="135" y="18" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="600">&lt;&lt;Facade&gt;&gt;</text>
    <text x="135" y="30" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">OrderProcessingFacade</text>
    <line x1="0" y1="34" x2="270" y2="34" stroke="#2563eb" stroke-width="1.5"/>
    <!-- Fields -->
    <text x="10" y="52" font-size="10" fill="#1e3a8a">- inventoryService: InventoryService</text>
    <text x="10" y="68" font-size="10" fill="#1e3a8a">- paymentProcessor: PaymentProcessor</text>
    <text x="10" y="84" font-size="10" fill="#1e3a8a">- shippingService: ShippingService</text>
    <text x="10" y="100" font-size="10" fill="#1e3a8a">- notificationService: NotificationService</text>
    <text x="10" y="116" font-size="10" fill="#1e3a8a">- activeOrders: Map&lt;String, ActiveOrderRecord&gt;</text>
    <line x1="0" y1="126" x2="270" y2="126" stroke="#bfdbfe" stroke-width="1"/>
    <!-- Methods -->
    <text x="10" y="145" font-size="10" font-weight="bold" fill="#1e3a8a">+ placeOrder(...): OrderResult</text>
    <text x="10" y="163" font-size="9" fill="#3b82f6">&nbsp;&nbsp;&nbsp;1. reserveStock()</text>
    <text x="10" y="179" font-size="9" fill="#3b82f6">&nbsp;&nbsp;&nbsp;2. processPayment() [rollback on fail]</text>
    <text x="10" y="195" font-size="9" fill="#3b82f6">&nbsp;&nbsp;&nbsp;3. dispatchOrder() [rollback on fail]</text>
    <text x="10" y="211" font-size="9" fill="#3b82f6">&nbsp;&nbsp;&nbsp;4. commitStock() &amp; notify()</text>
    <text x="10" y="235" font-size="10" font-weight="bold" fill="#1e3a8a">+ cancelOrder(orderId: String): boolean</text>
    <text x="10" y="253" font-size="9" fill="#3b82f6">&nbsp;&nbsp;&nbsp;(shipment cancel + refund + release stock)</text>
  </g>

  <!-- DTO Box OrderResult -->
  <g transform="translate(180, 420)" filter="url(#shadow)">
    <rect width="210" height="110" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <rect width="210" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="105" y="18" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">&lt;&lt;DTO&gt;&gt; OrderResult</text>
    <line x1="0" y1="26" x2="210" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="10" y="44" font-size="9.5" fill="#475569">- success: boolean</text>
    <text x="10" y="58" font-size="9.5" fill="#475569">- orderId, trackingNumber, message: String</text>
    <text x="10" y="72" font-size="9.5" fill="#475569">- totalAmount: double</text>
    <line x1="0" y1="80" x2="210" y2="80" stroke="#e2e8f0" stroke-width="1"/>
    <text x="10" y="98" font-size="9.5" fill="#1e293b">+ isSuccess(), getTrackingNumber()...</text>
  </g>

  <!-- Facade ..> OrderResult -->
  <path d="M 360 380 L 320 420" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#dashed-arrow)"/>
  <text x="350" y="405" font-size="9" fill="#64748b">returns</text>

  <!-- Subsystem Boundary Box -->
  <rect x="620" y="20" width="310" height="520" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="775" y="44" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">COMPLEX SUBSYSTEM (Unaware of Facade)</text>

  <!-- 1. InventoryService -->
  <g transform="translate(635, 60)" filter="url(#shadow)">
    <rect width="280" height="100" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <rect width="280" height="24" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="140" y="16" font-size="11" font-weight="bold" fill="#065f46" text-anchor="middle">InventoryService</text>
    <line x1="0" y1="24" x2="280" y2="24" stroke="#059669" stroke-width="1"/>
    <text x="8" y="40" font-size="9" fill="#1e293b">- stockLevels, reservations: Map</text>
    <line x1="0" y1="46" x2="280" y2="46" stroke="#e2e8f0" stroke-width="1"/>
    <text x="8" y="60" font-size="9" fill="#065f46">+ hasSufficientStock(prodId, qty): boolean</text>
    <text x="8" y="74" font-size="9" fill="#065f46">+ reserveStock(orderId, prodId, qty): boolean</text>
    <text x="8" y="88" font-size="9" fill="#065f46">+ releaseStock(orderId, prodId, qty): void</text>
  </g>

  <!-- 2. PaymentProcessor -->
  <g transform="translate(635, 180)" filter="url(#shadow)">
    <rect width="280" height="95" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect width="280" height="24" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="140" y="16" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">PaymentProcessor</text>
    <line x1="0" y1="24" x2="280" y2="24" stroke="#d97706" stroke-width="1"/>
    <text x="8" y="40" font-size="9" fill="#1e293b">- settledPayments: Map&lt;String, Double&gt;</text>
    <line x1="0" y1="46" x2="280" y2="46" stroke="#e2e8f0" stroke-width="1"/>
    <text x="8" y="60" font-size="9" fill="#92400e">+ processPayment(orderId, amt, method): boolean</text>
    <text x="8" y="76" font-size="9" fill="#92400e">+ refundPayment(orderId): boolean</text>
  </g>

  <!-- 3. ShippingService -->
  <g transform="translate(635, 295)" filter="url(#shadow)">
    <rect width="280" height="95" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="280" height="24" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="140" y="16" font-size="11" font-weight="bold" fill="#5b21b6" text-anchor="middle">ShippingService</text>
    <line x1="0" y1="24" x2="280" y2="24" stroke="#7c3aed" stroke-width="1"/>
    <text x="8" y="40" font-size="9" fill="#1e293b">- orderTrackingMap, trackingAddressMap: Map</text>
    <line x1="0" y1="46" x2="280" y2="46" stroke="#e2e8f0" stroke-width="1"/>
    <text x="8" y="60" font-size="9" fill="#5b21b6">+ dispatchOrder(orderId, address): String</text>
    <text x="8" y="76" font-size="9" fill="#5b21b6">+ cancelShipment(trackingNumber): boolean</text>
  </g>

  <!-- 4. NotificationService -->
  <g transform="translate(635, 410)" filter="url(#shadow)">
    <rect width="280" height="105" rx="5" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/>
    <rect width="280" height="24" rx="5" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
    <text x="140" y="16" font-size="11" font-weight="bold" fill="#9d174d" text-anchor="middle">NotificationService</text>
    <line x1="0" y1="24" x2="280" y2="24" stroke="#db2777" stroke-width="1"/>
    <text x="8" y="46" font-size="9" fill="#9d174d">+ sendOrderConfirmation(...): void</text>
    <text x="8" y="64" font-size="9" fill="#9d174d">+ sendPaymentFailureNotification(...): void</text>
    <text x="8" y="82" font-size="9" fill="#9d174d">+ sendCancellationNotification(...): void</text>
  </g>

  <!-- Connecting Lines from Facade to Subsystems -->
  <path d="M 560 160 C 590 140, 590 110, 630 110" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 560 210 C 590 210, 595 225, 630 225" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 560 270 C 590 270, 595 340, 630 340" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 560 330 C 585 350, 595 455, 630 455" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

</svg>
